name: Doc Update

on:
  push:
    branches: [master]
    paths:
      - 'polycloud-tickets-cli/**'
      - '.github/workflows/doc-update.yaml'
      - 'test/cases/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: doc-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: python3 -m pip install pyyaml

      - name: Regenerate CLI help snapshots
        run: ./doc_update.sh

      - name: Check for doc drift
        id: drift
        run: |
          if git diff --quiet -- "Tickets System.md"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail pull requests on doc drift
        if: steps.drift.outputs.changed == 'true' && github.event_name == 'pull_request'
        run: |
          echo "Tickets System.md is out of sync with the live CLI help output."
          echo "Merge the doc-update PR or run ./doc_update.sh before merging."
          exit 1

      - name: Open PR with refreshed snapshots
        if: steps.drift.outputs.changed == 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="doc-update-$(date -u +%Y%m%d%H%M%S)"
          git checkout -b "$branch"
          git add "Tickets System.md"
          git commit -m "Docs: refresh CLI help snapshots"
          git push origin "$branch"
          gh pr create --base master --head "$branch" \
            --title "Docs: refresh CLI help snapshots" \
            --body "Automated refresh of the CLI help snapshots generated by doc_update.sh."